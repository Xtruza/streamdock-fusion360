<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xtruza Fusion Command</title><link href="../utils/bootstrap.min.css" rel="stylesheet"><style>
:root{--yellow:#ffd400;--black:#080808;--panel:#151515;--muted:#a4a49d}*{box-sizing:border-box}body{margin:0;background:var(--black);color:#fff;font:13px Arial,sans-serif}.sdpi-wrapper{display:none;padding:18px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:32px 32px;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}.mark{width:34px;height:24px;border-left:8px solid var(--yellow);border-bottom:8px solid var(--yellow);transform:skew(35deg)}.brand strong{letter-spacing:.16em}.eyebrow{font-size:10px;color:var(--yellow);letter-spacing:.16em;text-transform:uppercase;margin:18px 0 7px}.form-control,.form-select{background:#111;border:1px solid #3a3a3a;color:#fff;border-radius:0}.form-control:focus,.form-select:focus{background:#111;color:#fff;border-color:var(--yellow);box-shadow:none}.form-check-input:checked{background-color:var(--yellow);border-color:var(--yellow)}.hint{color:var(--muted);font-size:11px;line-height:1.45}.test{width:100%;border:0;background:var(--yellow);color:#080808;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:12px;margin-top:18px}.status{margin-top:10px;border-left:3px solid #555;background:var(--panel);padding:10px;color:var(--muted)}.status.ok{border-color:var(--yellow);color:#fff}.status.error{border-color:#ff6565;color:#fff}
</style></head><body><div class="sdpi-wrapper"><div class="brand"><span class="mark"></span><strong>XTRUZA / FUSION</strong></div><p class="eyebrow">Command</p><select id="preset" class="form-select"></select><p class="eyebrow">Execution mode</p><select id="mode" class="form-select"><option value="auto">Auto · API then shortcut</option><option value="api">Fusion API only</option><option value="shortcut">Keyboard shortcut only</option></select><p class="eyebrow">Fusion command ID</p><input id="commandId" class="form-control" type="text" autocomplete="off"><p class="hint mt-1">Used by the optional Fusion bridge. Editable because native IDs may change.</p><p class="eyebrow">Fallback shortcut</p><input id="shortcut" class="form-control" type="text" placeholder="Example: Cmd+Shift+E" autocomplete="off"><div class="form-check mt-3"><input id="requireFusionFrontmost" class="form-check-input" type="checkbox"><label class="form-check-label" for="requireFusionFrontmost">Run shortcuts only when Fusion is frontmost</label></div><button id="test" class="test" type="button">Test configuration</button><div id="status" class="status">Choose a command and test the connection.</div></div><script src="../utils/common.js"></script><script src="../utils/action.js"></script><script src="../utils/axios.js"></script><script src="index.js"></script></body></html>
