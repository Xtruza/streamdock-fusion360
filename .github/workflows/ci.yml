name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: zip -r streamdock-fusion360-dev.zip com.xtruza.streamdock.fusion360.sdPlugin fusion-addin README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: streamdock-fusion360-dev
          path: streamdock-fusion360-dev.zip
